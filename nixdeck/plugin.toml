id = "gabrielnathan929/nixdeck"
name = "NixDeck"
version = "0.3.0"
plugin_api = 3
author = "gabrielnathan929"
license = "MIT"
icon = "settings"
description = "Control center for Hamra (NixOS): app toggles, SSH/GPG keys, install Flatpak/nix/mise/web apps, updates, system tasks."
dependencies = []
tags = ["nixos", "system", "panel", "launcher"]

[[panel]]
id = "main"
entry = "main.luau"
width = 780
height = 640
placement = "attached"
position = "auto"

[[launcher_provider]]
id = "menu"
entry = "launcher.luau"
prefix = "nixdeck"
include_in_global_search = false
